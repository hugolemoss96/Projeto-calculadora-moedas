<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Convert Money</title>
</head>
<body>

    <img class="logo" src="./Assets/logo.gif" alt="logo-central-convert-money">
    <main>
            <label>Converter <b>de</b>
                <select>
                    <option>R$ Real Brasileiro</option>
                </select>
            </label>

            <label>Converter <b>para</b>
                <select id="currency-select">
                    <option value="dolar">US$ Dólar americano</option>
                    <option value="euro">€ Euro</option>
                    <option value="libra">£ Libra esterlina</option>
                    <option value="bitcoin">₿ Bitcoin</option>
                </select>
            </label>

            <label><b>Valor</b>
                <input id="input-value" placeholder="R$ 10.000,00">
            </label>
            
            <button id="convert-button">Converter</button>

            <section>
                <div class="caixa-img">
                    <div>
                    <img class="real" src="./Assets/real.png" alt="moeda-a-converter">
                    <p class="paragraph-1">Real</p>
                    <p class="paragraph-2" id="value-real">R$0,00</p>
                    </div>

                    <img class="seta" src="./Assets/arrow.png" alt="imagem-de-seta">
                 
                    <div>
                    <img class="dolar" src="./Assets/dolar.png" id="currency-icon" alt="moeda-convertida">
                    <p class="paragraph-1" id="currency-name">Dólar Americano</p>
                    <p class="paragraph-2" id="value-converted">US$ 0.0</p>
                    </div>
                </div>
            </section>
    </main>

</body>
<script src="./Script.js"></script>
</html>
